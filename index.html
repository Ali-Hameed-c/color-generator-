<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الألوان العشوائية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .color-box {
            width: 250px;
            height: 150px;
            background-color: #FFFFFF;
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            transition: background-color 0.3s ease;
        }

        #colorCode {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
        }

        #btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مولد الألوان العشوائية</h1>
        <div class="color-box" id="colorBox">
            <span id="colorCode">#FFFFFF</span>
        </div>
        <button id="btn">تغيير اللون</button>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const colorBox = document.getElementById('colorBox');
        const colorCode = document.getElementById('colorCode');

        // دالة لتوليد لون عشوائي بصيغة Hex
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // الحدث عند الضغط على الزر
        btn.addEventListener('click', function() {
            const randomColor = getRandomColor();
            colorBox.style.backgroundColor = randomColor;
            colorCode.textContent = randomColor;
        });
    </script>
</body>
</html>
